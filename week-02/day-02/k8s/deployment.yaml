apiVersion: apps/v1
kind: Deployment

metadata:
  name: fastapi-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fastapi-day04

  template:
    metadata:
      labels:
        app: fastapi-day04

    spec:
      containers:
        - name: fastapi-container
          image: burhanulhaq/day-02-backend:latest
          ports:
            - containerPort: 8000

          env:
            - name: APP_VERSION
              value: "v2"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET_KEY

            - name: JWT_ALGORITHM
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_ALGORITHM

            - name: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES