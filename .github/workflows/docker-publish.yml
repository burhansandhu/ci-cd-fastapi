name: CI/CD - Docker Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Run linting
        run: uv run ruff check .

      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql+psycopg://postgres:postgres@localhost:5432/ci_cd' }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-jwt-secret-key-32-chars-long' }}
        run: uv run pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          echo "VERSION=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/day-02-backend:${{ steps.meta.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/day-02-backend:latest

      - name: Verify published image can be pulled and run
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/day-02-backend:${{ steps.meta.outputs.VERSION }}"
          echo "Pulling $IMAGE from Docker Hub..."
          docker pull "$IMAGE"
          echo "Starting test container from $IMAGE..."
          docker run -d --name test-app -p 8000:8000 \
            -e DATABASE_URL="postgresql+psycopg://postgres:postgres@localhost:5432/ci_cd" \
            -e JWT_SECRET_KEY="ci-verification-secret-key" \
            "$IMAGE"
          sleep 5
          docker logs test-app
          curl --fail http://localhost:8000/health
          docker stop test-app
          docker rm test-app
          echo "Verification successfully completed!"